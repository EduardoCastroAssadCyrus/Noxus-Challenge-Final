[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noxus-local"
version = "2.0.0"
description = "NoxusAgent e API local com persistência JSON"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
noxus = "noxus.__main__:main"

[tool.setuptools.packages.find]
include = ["noxus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
