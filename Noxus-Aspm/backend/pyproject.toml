[project]
name = "noxus-aspm-api"
version = "0.1.0"
description = "API inicial do Noxus ASPM"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
crew = ["crewai[litellm]>=1.0,<2.0", "python-dotenv>=1.0,<2.0", "PyYAML>=6.0,<7.0"]
dev = [
  "httpx2>=2.10,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
